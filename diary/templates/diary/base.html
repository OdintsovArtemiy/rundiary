<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>RunDiary</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="{% url 'home' %}">RunDiary</a>
        <div class="d-flex align-items-center">
            {% if user.is_authenticated %}
                <a class="text-white me-3" href="{% url 'dashboard' %}">Дневник</a>
                <a class="text-white me-3" href="{% url 'workout_add' %}">+ Тренировка</a>
                <a class="text-white me-3" href="{% url 'goals' %}">Цели</a>
                <form method="post" action="{% url 'logout' %}" class="d-inline m-0">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-link text-white p-0 align-baseline" style="text-decoration:none;">Выйти ({{ user.username }})</button>
                </form>
            {% else %}
                <a class="text-white me-3" href="{% url 'login' %}">Войти</a>
                <a class="text-white" href="{% url 'register' %}">Регистрация</a>
            {% endif %}
        </div>
    </div>
</nav>
<div class="container">
    {% block content %}{% endblock %}
</div>
</body>
</html>
